name: Import clean snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Import audited source snapshot
        run: |
          python3 - <<'PYTHON'
          import base64, io, tarfile
          payload = ""
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode(payload)), mode='r:gz') as archive:
              archive.extractall('.', filter='data')
          PYTHON
          git config user.name 'Tim-Gurke'
          git config user.email '277507206+Tim-Gurke@users.noreply.github.com'
          git add README.md docs app tests build.gradle settings.gradle gradle.properties .gitignore
          git commit -m 'Import audited ScootPit BMS 6.2 snapshot'
          git push origin HEAD:main
