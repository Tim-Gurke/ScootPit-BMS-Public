name: Build ScootPit BMS APK


on:
  workflow_dispatch:
  push:
    branches: [ main ]


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build APK
        run: |
          javac -d /tmp/joyor-tests app/src/main/java/de/wortmonster/jbdtrigger/BmsPacket.java app/src/main/java/de/wortmonster/jbdtrigger/BmsExtras.java app/src/main/java/de/wortmonster/jbdtrigger/JbdControl.java app/src/main/java/de/wortmonster/jbdtrigger/RangeEstimator.java app/src/main/java/de/wortmonster/jbdtrigger/RecentConsumption.java app/src/main/java/de/wortmonster/jbdtrigger/ScaleColorRange.java app/src/main/java/de/wortmonster/jbdtrigger/ScaleDirection.java app/src/main/java/de/wortmonster/jbdtrigger/GridPacking.java app/src/main/java/de/wortmonster/jbdtrigger/GpsPlausibility.java app/src/main/java/de/wortmonster/jbdtrigger/ConnectionPolicy.java app/src/main/java/de/wortmonster/jbdtrigger/RideMotion.java tests/*.java
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.JbdControlTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.BmsExtrasTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.BmsPacketTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.RangeEstimatorTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.RecentConsumptionTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.ScaleColorRangeTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.ScaleDirectionTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.RideMotionTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.ConnectionPolicyTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.GpsPlausibilityTest
          java -cp /tmp/joyor-tests de.wortmonster.jbdtrigger.GridPackingTest
          gradle assembleDebug lintDebug
      - name: Android analysis report
        if: always()
        run: |
          if [ -f app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt ]; then
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          fi
      - name: Select signing mode
        id: signing
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import os, base64
          from pathlib import Path
          keys = ['APP_KEYSTORE_BASE64', 'APP_KEYSTORE_PASSWORD', 'APP_KEY_ALIAS', 'APP_KEY_PASSWORD']
          present = [bool(os.environ.get(k)) for k in keys]
          if any(present) and not all(present):
              raise SystemExit('Signing configuration incomplete: provide all four APP signing secrets.')
          signed = all(present)
          if not signed:
              raise SystemExit('Official builds require the four APP signing secrets.')
          if signed:
              path = Path(os.environ['RUNNER_TEMP']) / 'scootpit-release.keystore'
              path.write_bytes(base64.b64decode(os.environ['APP_KEYSTORE_BASE64'], validate=True))
              path.chmod(0o600)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('signed=' + str(signed).lower() + '\n')
          PYTHON
      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          APP_KEYSTORE_FILE: ${{ runner.temp }}/scootpit-release.keystore
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify update signature and version
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee /tmp/apk-signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: c58abf26de59344a21efbc0576e391a36b6179724a0b4fad27a35de03de184fb' /tmp/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk > /tmp/apk-version.txt
          sed -n '1p' /tmp/apk-version.txt
          python3 - <<'PYTHON'
          import re
          from pathlib import Path
          config = Path('app/build.gradle').read_text()
          code = re.search(r'versionCode\s+(\d+)', config)[1]
          version = re.search(r"""versionName\s+['"]([^'"]+)['"]""", config)[1]
          badging = Path('/tmp/apk-version.txt').read_text()
          expected = f"name='de.wortmonster.jbdtrigger' versionCode='{code}' versionName='{version}'"
          if expected not in badging or 'application-debuggable' in badging:
              raise SystemExit('Release package or version verification failed.')
          PYTHON
      - name: Prepare APK artifact
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/ScootPit-BMS.apk
            echo 'signed-release' > dist/signing-mode.txt
          else
            echo 'Refusing to publish an APK without the release signature.' >&2
            exit 1
          fi
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/scootpit-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: ScootPit-BMS-APK
          path: dist/
      - name: Publish release for a new app version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle." >&2
            exit 1
          fi
          TAG="v$VERSION"
          NOTES="RELEASE-NOTES-$VERSION.md"
          APK_NAME="ScootPit-BMS-v$VERSION.apk"
          if [ ! -f "$NOTES" ]; then
            echo "No $NOTES found; keeping the successful build as an artifact without publishing a release."
            exit 0
          fi
          cp "$NOTES" "dist/$NOTES"
          cp dist/ScootPit-BMS.apk "dist/$APK_NAME"
          (
            cd dist
            sha256sum "$APK_NAME" > "SHA256SUMS-$VERSION.txt"
            zip -q "ScootPit-BMS-v$VERSION-Paket.zip" "$APK_NAME" signing-mode.txt "$NOTES" "SHA256SUMS-$VERSION.txt"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ASSET_NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$TAG" \
              "dist/$APK_NAME" \
              "dist/ScootPit-BMS-v$VERSION-Paket.zip" \
              "dist/$NOTES" \
              "dist/SHA256SUMS-$VERSION.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            if printf '%s\n' "$ASSET_NAMES" | grep -Fxq "ScootPit-BMS.apk"; then
              gh release delete-asset "$TAG" "ScootPit-BMS.apk" --repo "$GITHUB_REPOSITORY" --yes
            fi
            echo "Updated the existing $TAG release assets."
            exit 0
          fi
          gh release create "$TAG" \
            "dist/$APK_NAME" \
            "dist/ScootPit-BMS-v$VERSION-Paket.zip" \
            "dist/$NOTES" \
            "dist/SHA256SUMS-$VERSION.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ScootPit BMS $VERSION" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA"

